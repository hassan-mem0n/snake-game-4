<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>high score:
                        <span id="high-score">0</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>score:
                        <span id="score">0</span>
                    </h3>
                </div>
               
            </div>
            <div class="board"></div>
        </section>
        <div class="modal">
            <div class="start-game">
                <h3>Walcome to snake game</h3>
                <button class="btn btn-start">Sart game</button>
            </div>
            <div class="over-game">
                <h3>Game over</h3>
                <button class="btn btn-restart">Restart Game</button>
            </div>
        </div>

    </main>
    
    <script src="main.js"></script>
</body>
</html>
